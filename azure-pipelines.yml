trigger:
- master

pool:
  name: ltm

variables:
  tag: '$(Build.BuildId)'
  dockerRegistryServiceConnection: 'acr-ltim-01'
  imageRepository: 'pipeline-ci-cd'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'

steps:
- script: echo "PIPELINE YAML IS RUNNING"
  displayName: Debug marker

- checkout: self

- task: Docker@2
  displayName: Build and push image to ACR
  inputs:
    command: buildAndPush
    containerRegistry: $(dockerRegistryServiceConnection)
    repository: $(imageRepository)
    Dockerfile: $(dockerfilePath)
    tags: |
      $(tag)